[package]
name = "ai-usage"
version = "0.2.0"
edition = "2024"
description = "Local session usage and cost reports for OpenCode, Claude Code, and Codex"

[dependencies]
anyhow = "1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
dirs = "6"
notify = "8"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tabled = { version = "0.22", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
walkdir = "2"

[dev-dependencies]
tempfile = "3"
